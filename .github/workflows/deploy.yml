name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
 
concurrency:
  group: "pages"
  cancel-in-progress: true
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      # Resume PDF is gitignored (personal). Deploy pulls base64 from a secret
      # gist raw URL (see scripts/sync-resume-pdf.sh). Local: keep PDF under content/.
      - name: Fetch private resume PDF
        env:
          RESUME_PDF_URL: ${{ secrets.RESUME_PDF_URL }}
        run: |
          set -euo pipefail
          dest="content/RexfordMachu_SRE_SWE_ObservabilityEngineer.pdf"
          if [ -z "${RESUME_PDF_URL:-}" ]; then
            echo "::error::RESUME_PDF_URL secret is not set. Run scripts/sync-resume-pdf.sh"
            exit 1
          fi
          curl -fsSL "$RESUME_PDF_URL" | base64 --decode > "$dest"
          file "$dest"
          test -s "$dest"
      
      - name: Build Quartz
        run: npx quartz build
      
      - name: Build Summary
        run: |
          echo "✅ Build completed successfully"
          du -sh public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Deployment Summary
        run: echo "🚀 Deployed to ${{ steps.deployment.outputs.page_url }}"
